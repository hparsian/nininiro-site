<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سفارش شما ثبت شد | نی نی نیرو</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <img src="assets/img/logo-icon.webp" alt="نی نی نیرو" width="46" height="46" loading="eager">
      <div class="brand-text">
        <span class="brand-fa">نی نی نیرو</span>
        <span class="brand-en">NININIRO</span>
      </div>
    </a>
  </div>
</header>

<div class="container">
  <div class="status-page">
    <div class="status-icon">✅</div>
    <h1>پرداخت با موفقیت انجام شد</h1>
    <p id="status-order-code">سفارش شما ثبت شد و به‌زودی پردازش می‌شود.</p>
    <a href="index.html" class="btn btn-primary">بازگشت به فروشگاه</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const orderCode = params.get('order');
  if (orderCode) {
    document.getElementById('status-order-code').textContent =
      `کد پیگیری سفارش شما: ${orderCode} — این کد را برای پیگیری نزد خودتان نگه دارید.`;
  }
  // سبد خرید بعد از پرداخت موفق دیگر معتبر نیست، توکن قدیمی را پاک کن
  localStorage.removeItem('nnr_cart_token');
</script>
</body>
</html>
